name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  dart-checks:
    name: Dart checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Generated-code freshness
        run: |
          bash scripts/gen.sh
          git diff --exit-code || {
            echo "Generated code is stale. Run scripts/gen.sh and commit."
            exit 1
          }

      - name: Run Dart tests
        run: flutter test --coverage

  kotlin-checks:
    name: Kotlin checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: ktlintCheck and rules-engine tests
        working-directory: android
        run: ./gradlew :rules-engine:ktlintCheck :rules-engine:test

  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: [dart-checks, kotlin-checks]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Android unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
